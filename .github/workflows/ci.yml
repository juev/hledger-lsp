name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          threshold-total: 70
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - run: go build -v ./...
      # The NFR tests are tagged `perf` and run on demand via `make perf`, not
      # in CI: ratio thresholds on a shared runner are noise, and a gate that
      # flakes gets switched off. Compile them here so the suite cannot rot
      # unnoticed between runs.
      - name: Compile NFR performance tests
        run: go vet -tags perf ./internal/benchmark/

  # Builds the GOOS=wasip1 module and drives it as a stdio language server
  # under wasmtime and Node, comparing every answer with the native build.
  wasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '50.0.1'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: GOOS=wasip1 GOARCH=wasm go vet ./...
      - name: WASI smoke test
        run: go test ./cmd/hledger-lsp -run WASISmoke -count=1 -v
        env:
          HLEDGER_WASI_RUNTIME: wasmtime,node
