version: 2

builds:
  - main: ./cmd/hledger-lsp
    binary: hledger-lsp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
      - 386
      - arm
    ignore:
      # macOS only supports 64-bit
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      # Windows: focus on modern systems (64-bit only)
      - goos: windows
        goarch: 386
      - goos: windows
        goarch: arm
      # FreeBSD: 64-bit only
      - goos: freebsd
        goarch: 386
      - goos: freebsd
        goarch: arm
      # OpenBSD: 64-bit only
      - goos: openbsd
        goarch: 386
      - goos: openbsd
        goarch: arm
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.ShortCommit}}
      - -X main.Date={{.Date}}

  # WebAssembly build for WASI preview 1 hosts (wasmtime, Node's node:wasi).
  # The post hook runs the stdio LSP smoke test against the built module, so
  # a module that fails under a real runtime stops the release.
  - id: hledger-lsp-wasi
    main: ./cmd/hledger-lsp
    binary: hledger-lsp
    env:
      - CGO_ENABLED=0
    goos:
      - wasip1
    goarch:
      - wasm
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.ShortCommit}}
      - -X main.Date={{.Date}}
    hooks:
      post:
        - cmd: go test ./cmd/hledger-lsp -run WASISmoke -count=1
          env:
            - HLEDGER_WASI_RUNTIME=wasmtime,node
            - HLEDGER_WASI_WASM={{ abs .Path }}
          output: true

archives:
  - formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: minisign
    args:
      - -S
      - -s
      - /tmp/minisign.key
      - -m
      - ${artifact}
      - -x
      - ${signature}
    signature: ${artifact}.minisig
    artifacts: all

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
